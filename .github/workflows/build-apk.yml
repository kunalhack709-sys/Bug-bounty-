name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION_STR=$(java -version 2>&1 | head -n 1)
          echo "Java Version String: $JAVA_VERSION_STR"
          JAVA_MAJOR=$(echo "$JAVA_VERSION_STR" | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verification passed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore "debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Error: Failed to create debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK!"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files in app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Compiled APK file is empty!"
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: File extension is not .apk"; exit 1 ;;
          esac
          echo "APK verified successfully at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_DIR"
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}' | sed 's/[^a-zA-Z0-9._-]/_/g')
          RELEASE_APK_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_DIR}/${RELEASE_APK_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty!"
            exit 1
          fi
          echo "asset_path=${DEST_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${RELEASE_APK_NAME}" >> $GITHUB_OUTPUT
          echo "Asset path: ${DEST_PATH}"
          echo "Asset name: ${RELEASE_APK_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset invalid before release creation"
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES="This is an automatically generated debug APK.

          - Built by: GitHub Actions
          - Run number: ${{ github.run_number }}
          - Run attempt: ${{ github.run_attempt }}
          - Commit SHA: ${{ github.sha }}

          *Note: This APK is intended for testing purposes and is signed only with a temporary debug keystore. It is not a production release.*"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: ${{ steps.prep_asset.outputs.asset_name }}"

            echo "### 🚀 Debug APK Ready for Download" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK has been published to GitHub Releases!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [$RELEASE_TAG]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download:** Download **\`${{ steps.prep_asset.outputs.asset_name }}\`** directly under the Assets section." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact:** The build artifact **\`app-debug-apk\`** is also available on this workflow run." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::GitHub Release publishing was not completed or encountered an issue."
            echo "The APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."

            echo "### 📦 Debug APK Built (Artifact Available)" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ GitHub Release publishing encountered an issue or was skipped, but the APK build succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "You can download the compiled APK artifact **\`app-debug-apk\`** directly from the summary section of this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
